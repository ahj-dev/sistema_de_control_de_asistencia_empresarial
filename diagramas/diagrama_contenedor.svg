<svg width="100%" viewBox="0 0 680 620" role="img">
  <title>Diagrama C4 - Nivel 2: Contenedor</title>
  <desc>Diagrama de contenedor mostrando Next.js, NestJS API, Prisma ORM y PostgreSQL comunicándose dentro del sistema.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Fondo blanco -->
  <rect width="680" height="620" fill="white"/>

  <!-- Título -->
  <text font-family="Arial, sans-serif" font-size="15" font-weight="bold" x="340" y="26" text-anchor="middle" fill="#1a1a1a">Nivel 2 — Diagrama de contenedor</text>

  <!-- Borde del sistema -->
  <rect x="30" y="44" width="620" height="490" rx="16" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="6 4"/>
  <text font-family="Arial, sans-serif" font-size="11" x="42" y="60" fill="#888">«sistema» Control de Asistencia Empresarial</text>

  <!-- FRONTEND: Next.js -->
  <rect x="60" y="80" width="200" height="100" rx="10" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="160" y="112" text-anchor="middle" fill="#042C53">Frontend</text>
  <text font-family="Arial, sans-serif" font-size="11" x="160" y="130" text-anchor="middle" fill="#0C447C">Next.js 14 + TypeScript</text>
  <text font-family="Arial, sans-serif" font-size="11" x="160" y="148" text-anchor="middle" fill="#0C447C">Puerto 3000 · App Router</text>

  <!-- BACKEND: NestJS -->
  <rect x="240" y="280" width="200" height="100" rx="10" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="340" y="310" text-anchor="middle" fill="#26215C">Backend API</text>
  <text font-family="Arial, sans-serif" font-size="11" x="340" y="328" text-anchor="middle" fill="#3C3489">NestJS + TypeScript</text>
  <text font-family="Arial, sans-serif" font-size="11" x="340" y="346" text-anchor="middle" fill="#3C3489">Puerto 3001 · REST /api/v1</text>

  <!-- PRISMA ORM -->
  <rect x="240" y="430" width="200" height="80" rx="10" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="340" y="462" text-anchor="middle" fill="#04342C">Prisma ORM</text>
  <text font-family="Arial, sans-serif" font-size="11" x="340" y="480" text-anchor="middle" fill="#0F6E56">Migraciones · Queries tipados</text>

  <!-- POSTGRESQL -->
  <rect x="460" y="430" width="160" height="80" rx="10" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="540" y="460" text-anchor="middle" fill="#412402">PostgreSQL 16</text>
  <text font-family="Arial, sans-serif" font-size="11" x="540" y="478" text-anchor="middle" fill="#633806">Puerto 5432</text>
  <text font-family="Arial, sans-serif" font-size="11" x="540" y="494" text-anchor="middle" fill="#633806">Base de datos relacional</text>

  <!-- DOCKER COMPOSE -->
  <rect x="460" y="80" width="160" height="80" rx="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="540" y="110" text-anchor="middle" fill="#2C2C2A">Docker Compose</text>
  <text font-family="Arial, sans-serif" font-size="11" x="540" y="128" text-anchor="middle" fill="#444441">Orquestación de</text>
  <text font-family="Arial, sans-serif" font-size="11" x="540" y="144" text-anchor="middle" fill="#444441">servicios</text>

  <!-- Auth JWT -->
  <rect x="60" y="280" width="160" height="80" rx="10" fill="#F0997B" stroke="#993C1D" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="140" y="310" text-anchor="middle" fill="#4A1B0C">Auth JWT</text>
  <text font-family="Arial, sans-serif" font-size="11" x="140" y="328" text-anchor="middle" fill="#712B13">Passport + JwtAuthGuard</text>
  <text font-family="Arial, sans-serif" font-size="11" x="140" y="344" text-anchor="middle" fill="#712B13">Guard global</text>

  <!-- Usuario -->
  <rect x="60" y="430" width="160" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="140" y="454" text-anchor="middle" fill="#04342C">Usuario (browser)</text>
  <text font-family="Arial, sans-serif" font-size="11" x="140" y="472" text-anchor="middle" fill="#0F6E56">Empleado / RRHH / Admin</text>

  <!-- Flechas -->
  <path d="M 260 180 L 260 280" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" x="228" y="230" text-anchor="end" fill="#444">HTTP + JWT</text>
  <text font-family="Arial, sans-serif" font-size="10" x="228" y="246" text-anchor="end" fill="#444">/api/v1</text>

  <line x1="340" y1="380" x2="340" y2="428" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" x="356" y="408" fill="#444">queries</text>

  <line x1="440" y1="470" x2="458" y2="470" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" x="449" y="462" fill="#444">SQL</text>

  <line x1="160" y1="180" x2="150" y2="278" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" x="118" y="232" fill="#444">valida token</text>

  <line x1="220" y1="320" x2="238" y2="320" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" x="232" y="313" fill="#444">autoriza</text>

  <path d="M 460 120 L 262 120" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text font-family="Arial, sans-serif" font-size="10" x="360" y="113" text-anchor="middle" fill="#444">gestiona</text>

  <line x1="140" y1="428" x2="140" y2="182" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Leyenda -->
  <rect x="40" y="560" width="12" height="12" rx="2" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="58" y="570" fill="#333">Frontend</text>
  <rect x="130" y="560" width="12" height="12" rx="2" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="148" y="570" fill="#333">Backend</text>
  <rect x="210" y="560" width="12" height="12" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="228" y="570" fill="#333">ORM</text>
  <rect x="270" y="560" width="12" height="12" rx="2" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="288" y="570" fill="#333">Base de datos</text>
  <rect x="380" y="560" width="12" height="12" rx="2" fill="#F0997B" stroke="#993C1D" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="398" y="570" fill="#333">Seguridad</text>

  <text font-family="Arial, sans-serif" font-size="11" x="340" y="600" text-anchor="middle" fill="#666">C4 Model — Nivel 2: Contenedor · CORHUILA 2026A</text>
</svg>