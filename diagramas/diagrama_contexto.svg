<svg width="100%" viewBox="0 0 680 560" role="img">
  <title>Diagrama C4 - Nivel 1: Contexto</title>
  <desc>Diagrama de contexto del Sistema de Control de Asistencia Empresarial mostrando actores, el sistema central y sistemas externos.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Fondo blanco -->
  <rect width="680" height="560" fill="white"/>

  <!-- Título -->
  <text font-family="Arial, sans-serif" font-size="15" font-weight="bold" x="340" y="28" text-anchor="middle" fill="#1a1a1a">Nivel 1 — Diagrama de contexto</text>

  <!-- Sistema central -->
  <rect x="220" y="190" width="240" height="90" rx="12" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="340" y="222" text-anchor="middle" fill="#26215C">Sistema de Asistencia</text>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="340" y="238" text-anchor="middle" fill="#26215C">Empresarial</text>
  <text font-family="Arial, sans-serif" font-size="11" x="340" y="256" text-anchor="middle" fill="#3C3489">NestJS + Next.js + PostgreSQL</text>

  <!-- Actor: Empleado -->
  <rect x="30" y="60" width="140" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="100" y="84" text-anchor="middle" fill="#04342C">Empleado</text>
  <text font-family="Arial, sans-serif" font-size="11" x="100" y="102" text-anchor="middle" fill="#0F6E56">Registra entrada/salida</text>

  <!-- Actor: RRHH -->
  <rect x="30" y="200" width="140" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="100" y="224" text-anchor="middle" fill="#04342C">RRHH</text>
  <text font-family="Arial, sans-serif" font-size="11" x="100" y="242" text-anchor="middle" fill="#0F6E56">Consulta reportes</text>

  <!-- Actor: Administrador -->
  <rect x="30" y="340" width="140" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="100" y="364" text-anchor="middle" fill="#04342C">Administrador</text>
  <text font-family="Arial, sans-serif" font-size="11" x="100" y="382" text-anchor="middle" fill="#0F6E56">Gestiona configuración</text>

  <!-- Actor: Jefe Depto -->
  <rect x="510" y="60" width="140" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="580" y="84" text-anchor="middle" fill="#04342C">Jefe de Depto.</text>
  <text font-family="Arial, sans-serif" font-size="11" x="580" y="102" text-anchor="middle" fill="#0F6E56">Supervisa asistencia</text>

  <!-- Sistema externo: PostgreSQL -->
  <rect x="510" y="190" width="140" height="56" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="580" y="214" text-anchor="middle" fill="#412402">PostgreSQL</text>
  <text font-family="Arial, sans-serif" font-size="11" x="580" y="232" text-anchor="middle" fill="#633806">Base de datos</text>

  <!-- Sistema externo: Docker -->
  <rect x="510" y="340" width="140" height="56" rx="8" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" x="580" y="364" text-anchor="middle" fill="#2C2C2A">Docker</text>
  <text font-family="Arial, sans-serif" font-size="11" x="580" y="382" text-anchor="middle" fill="#444441">Infraestructura</text>

  <!-- Flechas actores → sistema -->
  <line x1="170" y1="88" x2="218" y2="215" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="170" y1="228" x2="218" y2="235" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="170" y1="368" x2="218" y2="265" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Flechas sistema → externos -->
  <line x1="460" y1="215" x2="508" y2="215" stroke="#BA7517" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="510" y1="88" x2="462" y2="215" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="510" y1="368" x2="462" y2="270" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Etiquetas de flechas -->
  <text font-family="Arial, sans-serif" font-size="10" x="178" y="158" text-anchor="middle" fill="#444">usa vía browser</text>
  <text font-family="Arial, sans-serif" font-size="10" x="188" y="232" text-anchor="middle" fill="#444">consulta reportes</text>
  <text font-family="Arial, sans-serif" font-size="10" x="188" y="312" text-anchor="middle" fill="#444">configura sistema</text>
  <text font-family="Arial, sans-serif" font-size="10" x="492" y="205" text-anchor="middle" fill="#444">persiste datos</text>
  <text font-family="Arial, sans-serif" font-size="10" x="495" y="145" text-anchor="middle" fill="#444">supervisa</text>
  <text font-family="Arial, sans-serif" font-size="10" x="495" y="310" text-anchor="middle" fill="#444">orquesta</text>

  <!-- Leyenda -->
  <rect x="40" y="465" width="14" height="14" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="60" y="476" fill="#333">Sistema central</text>
  <rect x="150" y="465" width="14" height="14" rx="3" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="170" y="476" fill="#333">Usuario (actor)</text>
  <rect x="270" y="465" width="14" height="14" rx="3" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="290" y="476" fill="#333">Sistema externo</text>
  <rect x="400" y="465" width="14" height="14" rx="3" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
  <text font-family="Arial, sans-serif" font-size="11" x="420" y="476" fill="#333">Infraestructura</text>

  <!-- Nota C4 -->
  <text font-family="Arial, sans-serif" font-size="11" x="340" y="510" text-anchor="middle" fill="#666">C4 Model — Nivel 1: Contexto del sistema</text>
  <text font-family="Arial, sans-serif" font-size="11" x="340" y="528" text-anchor="middle" fill="#666">Sistema de Control de Asistencia Empresarial · CORHUILA 2026A</text>
</svg>